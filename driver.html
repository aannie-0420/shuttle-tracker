<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>司機端 - 智慧追蹤版</title>
<style>
    body { font-family: sans-serif; padding: 20px; background: #f8f9fa; }
    .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
    button { padding: 25px; border-radius: 15px; border: none; font-size: 24px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .active-small { background: #1565C0 !important; color: white !important; }
    .active-medium { background: #2E7D32 !important; color: white !important; }
    #info-panel { text-align: left; background: #e3f2fd; padding: 20px; border-radius: 15px; font-size: 20px; line-height: 2.0; font-weight: bold; }
</style>
</head>
<body>

<div class="card">
    <h2>🚐 研華接駁車司機端</h2>
    <div class="btn-group">
        <button id="btn-small" onclick="selectBus('small')">🚗 小巴</button>
        <button id="btn-medium" onclick="selectBus('medium')">🚌 中巴</button>
    </div>
    
    <div id="info-panel">
        <div id="status">狀態：⚪ 請選擇車型</div>
        <div id="eta" style="color: #d32f2f;">預估抵達園區：--</div>
        <div id="coords">座標：--</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const db = getDatabase(initializeApp({
        databaseURL: "https://advantech-shuttle-tracker-default-rtdb.asia-southeast1.firebasedatabase.app"
    }));

    const ADVANTECH = { lat: 25.0575, lng: 121.3817 };

    // 計算 ETA 函數
    function calculateETA(lat, lng) {
        const R = 6371;
        const dLat = (ADVANTECH.lat - lat) * Math.PI / 180;
        const dLng = (ADVANTECH.lng - lng) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat*Math.PI/180) * Math.cos(ADVANTECH.lat*Math.PI/180) * Math.sin(dLng/2)**2;
        const distance = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        const minutes = Math.round((distance / 30) * 60);
        return minutes > 0 ? minutes + " 分鐘" : "即將抵達";
    }

    window.selectBus = (type) => {
        // 1. 強制重置機制：確保另一台車必定離線
        update(ref(db, "shuttle/small"), { status: "offline" });
        update(ref(db, "shuttle/medium"), { status: "offline" });

        // 2. 更新 UI 樣式
        document.getElementById('btn-small').className = (type === 'small') ? 'active-small' : '';
        document.getElementById('btn-medium').className = (type === 'medium') ? 'active-medium' : '';
        document.getElementById('status').innerText = "狀態：📍 啟動定位中...";
        
        // 3. 開始 GPS 追蹤
        navigator.geolocation.watchPosition((pos) => {
            const { latitude, longitude } = pos.coords;
            const eta = calculateETA(latitude, longitude);
            
            // 4. 更新該車型狀態
            update(ref(db, "shuttle/" + type), { 
                lat: latitude, 
                lng: longitude, 
                eta: eta, 
                timestamp: Date.now(), 
                status: "online" 
            });
            
            // 5. 更新司機介面資訊
            document.getElementById('status').innerText = "狀態：📍 追蹤中 (" + (type==='small'?'小巴':'中巴') + ")";
            document.getElementById('eta').innerText = "預估抵達園區：" + eta;
            document.getElementById('coords').innerText = "座標：" + latitude.toFixed(4) + ", " + longitude.toFixed(4);
        }, null, { enableHighAccuracy: true });
    };
</script>
</body>
</html>
