        set(archiveRef, commuteHistory); // 一次寫入全部紀錄，極致省下寫入額度
        commuteHistory = []; // 清空記憶體
    }
}

window.addEventListener("beforeunload", () => {
    if (selectedType) {
        uploadHistory();
        update(ref(db, "shuttle/" + selectedType), { timestamp: 0, status: "offline" });
    }
});

function checkAndTriggerKillSwitch(runningType) {
    if (new Date().getHours() >= 19) {
        uploadHistory(); // 時間到，打包封存
        if (watchId) navigator.geolocation.clearWatch(watchId);
        if (etaInterval) clearInterval(etaInterval);
        update(ref(db, "shuttle/" + runningType), { status: "scheduled", timestamp: Date.now() });
        return true;
    }
    return false;
}
