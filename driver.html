function distanceMeters(lat1, lng1, lat2, lng2) {
    if (window.google && google.maps && google.maps.geometry) {
        const p1 = new google.maps.LatLng(lat1, lng1);
        const p2 = new google.maps.LatLng(lat2, lng2);
        return google.maps.geometry.spherical.computeDistanceBetween(p1, p2);
    }

    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLng / 2) ** 2;

    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function getDirection(lat, lng, accuracy) {
    if (currentStopStatus === "atCampus") {
        lastDirection = "toA8";
        directionTracker.force(lastDirection);
        return lastDirection;
    }
    if (currentStopStatus === "atA8") {
        lastDirection = "toAdvantech";
        directionTracker.force(lastDirection);
        return lastDirection;
    }
    lastDirection = directionTracker.addFix({
        lat,
        lng,
        accuracy: Number(accuracy) || 0,
        timestamp: lastProcessedGpsTimestamp
    });
    lastLat = lat;
    lastLng = lng;
    return lastDirection;
}

function getTerminalStopStatus(lat, lng) {
    const distanceToCampus = distanceMeters(lat, lng, LIN_KOU_CAMPUS.lat, LIN_KOU_CAMPUS.lng);
    const distanceToA8 = distanceMeters(lat, lng, A8_STATION_GPS.lat, A8_STATION_GPS.lng);
    const candidate = distanceToCampus <= STOP_RADIUS ? "atCampus" :
        (distanceToA8 <= STOP_RADIUS ? "atA8" : null);

    if (!candidate) {
        terminalCandidate = null;
        terminalStillSince = 0;
        terminalAnchor = null;
        currentStopStatus = null;
        return null;
    }

    const anchorMoved = terminalAnchor
        ? distanceMeters(terminalAnchor.lat, terminalAnchor.lng, lat, lng)
        : 0;

    if (candidate !== terminalCandidate || !terminalAnchor || anchorMoved > TERMINAL_STILL_RADIUS) {
        terminalCandidate = candidate;
        terminalStillSince = Date.now();
        terminalAnchor = { lat, lng };
        currentStopStatus = null;
        return null;
    }

    if (Date.now() - terminalStillSince >= TERMINAL_STILL_MS) {
        const justConfirmedStop = currentStopStatus !== candidate;
        currentStopStatus = candidate;
        lastDirection = candidate === "atCampus" ? "toA8" : "toAdvantech";
        // A8 停靠一確認，立即以當下座標重查返回園區 ETA。
        if (justConfirmedStop && candidate === "atA8") lastGoogleUpdate = 0;
    }

    return currentStopStatus;
}

function getElementMinutes(element) {
    if (!element || element.status !== "OK") return null;
    const duration = element.duration_in_traffic || element.duration;
    if (!duration) return null;
    return Math.max(1, Math.round(duration.value / 60));
}

function isGoogleEtaServiceTime(now = new Date()) {
    return ShuttleV2Core.isGoogleEtaTime(now);
}

function archiveBatchId(now = Date.now()) {
    return "batch_" + Math.floor(now / ARCHIVE_INTERVAL);
}

async function flushArchiveWithRetry(batchId = archiveRetryBatchId || archiveBatchId()) {
    if (!selectedType || !driverRuntime.canWriteLive(selectedType)) return;
    if (archiveRetryTimer && batchId !== archiveRetryBatchId) return;
    try {
        await driverRuntime.flushArchive(batchId);
        archiveRetryDelay = 30 * 1000;
        archiveRetryBatchId = null;
        if (archiveRetryTimer) clearTimeout(archiveRetryTimer);
        archiveRetryTimer = null;
    } catch (error) {
        console.error("座標封存失敗，稍後重試", error);
        archiveRetryBatchId = batchId;
        if (!archiveRetryTimer) {
            const delay = archiveRetryDelay;
            archiveRetryDelay = Math.min(archiveRetryDelay * 2, 5 * 60 * 1000);
            archiveRetryTimer = setTimeout(() => {
                archiveRetryTimer = null;
                flushArchiveWithRetry(batchId);
            }, delay);
        }
    }
}

function requestGoogleMinutes(origin, destination) {
    return new Promise((resolve, reject) => {
        const service = new google.maps.DistanceMatrixService();
        service.getDistanceMatrix({
            origins: [origin],
            destinations: [destination],
            travelMode: "DRIVING",
            drivingOptions: {
                departureTime: new Date(),
                trafficModel: "bestguess"
            }
        }, (response, status) => {
            if (status !== "OK") {
                reject(new Error("Google Distance Matrix: " + status));
                return;
            }
            const minutes = getElementMinutes(response && response.rows &&
                response.rows[0] && response.rows[0].elements && response.rows[0].elements[0]);
            if (minutes === null) {
                reject(new Error("Google Distance Matrix element unavailable"));
                return;
            }
            resolve(minutes);
        });
    });
}

async function getSharedTrafficMinutes(key, origin, destination, fallbackMinutes) {
    const segmentRef = ref(db, "shuttle/sharedTraffic/" + key);
    const now = Date.now();
    const firstSnapshot = await get(segmentRef);
    const firstValue = firstSnapshot.val() || {};
    const firstMinutes = Number(firstValue.minutes);
    const firstUpdatedAt = Number(firstValue.updatedAt) || 0;

    if (Number.isFinite(firstMinutes) && firstMinutes > 0 &&
        now - firstUpdatedAt < SHARED_TRAFFIC_INTERVAL) {
        return firstMinutes;
    }

    const lockToken = mySessionId + "_" + key + "_" + now;
    const transaction = await runTransaction(segmentRef, current => {
        const value = current || {};
        const updatedAt = Number(value.updatedAt) || 0;
        const minutes = Number(value.minutes);
        if (Number.isFinite(minutes) && minutes > 0 && now - updatedAt < SHARED_TRAFFIC_INTERVAL) {
            return value;
        }
        if (Number(value.lockUntil) > now) return value;
        return { ...value, lockToken, lockUntil: now + 30000 };
    }, { applyLocally: false });

    const transactionValue = transaction.snapshot.val() || {};
    if (transactionValue.lockToken !== lockToken) {
        const cachedMinutes = Number(transactionValue.minutes);
        return Number.isFinite(cachedMinutes) && cachedMinutes > 0
            ? cachedMinutes
            : fallbackMinutes;
    }

    try {
        const minutes = await requestGoogleMinutes(origin, destination);
        await update(segmentRef, {
            minutes,
            updatedAt: Date.now(),
            lockToken: null,
            lockUntil: 0,
            updatedBy: myDeviceId
        });
        return minutes;
    } catch (error) {
        await update(segmentRef, { lockToken: null, lockUntil: 0 });
        throw error;
    }
}

async function refreshSharedTrafficSegments() {
    if (!selectedType || !isGoogleEtaServiceTime() || !window.google || !google.maps) return;
    try {
        [lastA8ToCampus, lastCampusToA8] = await Promise.all([
            getSharedTrafficMinutes("a8ToCampus", A8_STATION_GPS, LIN_KOU_CAMPUS, DEFAULT_A8_TO_CAMPUS_MIN),
            getSharedTrafficMinutes("campusToA8", LIN_KOU_CAMPUS, A8_STATION_GPS, DEFAULT_A8_TO_CAMPUS_MIN)
        ]);
    } catch (error) {
        console.error("固定路段 ETA 更新失敗", error);
    }
}

async function calculateAndPushETA(runningType, lat, lng, direction) {
    if (checkAndTriggerKillSwitch(runningType)) return;
    if (!isGoogleEtaServiceTime()) return;
    if (!driverRuntime.canWriteLive(runningType)) return;

    const now = Date.now();
    const distanceToCampus = distanceMeters(lat, lng, LIN_KOU_CAMPUS.lat, LIN_KOU_CAMPUS.lng);

    // 返回園區且距離園區 100 公尺內，不再呼叫 Google API。
    // 130 公尺退出半徑用來避免 GPS 在 100 公尺邊界附近來回跳動。
    const keepNearCampusStatus =
        lastEtaStatus === "nearCampus" && distanceToCampus <= NEAR_CAMPUS_EXIT_RADIUS;

    if (currentStopStatus !== "atCampus" &&
        ((direction === "toAdvantech" && distanceToCampus <= NEAR_CAMPUS_RADIUS) || keepNearCampusStatus)) {
        lastEtaStatus = "nearCampus";
        lastEtaToCampus = null;

        await update(ref(db, "shuttle/" + runningType), {
            etaStatus: lastEtaStatus,
            etaToCampus: null,
            totalCommute: lastTotalCommute,
            trafficTime: lastTrafficTime,
            timestamp: Date.now()
        });

        updateDriverETA();
        return;
    }

    if (lastEtaStatus === "nearCampus" && distanceToCampus > NEAR_CAMPUS_EXIT_RADIUS) {
        lastEtaStatus = null;
    }

    if (currentStopStatus !== "atCampus" && direction === "toA8" && distanceToCampus <= 100) {
        lastEtaStatus = null;
        lastEtaToCampus = null;
        lastTotalCommute = DEFAULT_TOTAL_COMMUTE_MIN;
        lastTrafficTime = DEFAULT_A8_TO_CAMPUS_MIN;

        await update(ref(db, "shuttle/" + runningType), {
            etaStatus: null,
            etaToCampus: null,
            totalCommute: lastTotalCommute,
            trafficTime: lastTrafficTime,
            timestamp: Date.now()
        });

        document.getElementById("eta").innerText = "預估抵達園區：前往 A8 中";
        return;
    }

    if (!ShuttleV2Core.isEtaCycleDue({
        lastAttemptAt: lastGoogleAttempt,
        now,
        intervalMs: CURRENT_ETA_INTERVAL
    })) return;
    if (etaRequestInFlight || !window.google || !google.maps) return;
    if (direction !== "toA8" && direction !== "toAdvantech") return;

    lastGoogleAttempt = now;
    etaRequestInFlight = true;
    const cycleId = ShuttleV2Core.buildEtaCycleId(now);
    const asyncToken = driverRuntime.createAsyncToken();
    await update(ref(db, "shuttle/" + runningType), {
        googleAttemptedAt: now,
        googleCycleId: cycleId,
        googleCycleStatus: "pending"
    });

    try {
        const campusToA8Promise = getSharedTrafficMinutes(
            "campusToA8", LIN_KOU_CAMPUS, A8_STATION_GPS, DEFAULT_A8_TO_CAMPUS_MIN
        );
        let model;

        if (currentStopStatus === "atCampus") {
            lastCampusToA8 = await campusToA8Promise;
            model = ShuttleLogic.calculateEtaModel({
                state: "atCampus",
                campusToA8: lastCampusToA8
            });
            logStop("campus", runningType, lat, lng, direction);
        } else if (currentStopStatus === "atA8") {
            [lastCampusToA8, lastA8ToCampus] = await Promise.all([
                campusToA8Promise,
                getSharedTrafficMinutes("a8ToCampus", A8_STATION_GPS, LIN_KOU_CAMPUS, DEFAULT_A8_TO_CAMPUS_MIN)
            ]);
            model = ShuttleLogic.calculateEtaModel({
                state: "atA8",
                a8ToCampus: lastA8ToCampus,
                campusToA8: lastCampusToA8
            });
            logStop("a8", runningType, lat, lng, direction);
        } else if (direction === "toA8") {
            [lastCurrentToA8, lastA8ToCampus, lastCampusToA8] = await Promise.all([
                requestGoogleMinutes({ lat, lng }, A8_STATION_GPS),
                getSharedTrafficMinutes("a8ToCampus", A8_STATION_GPS, LIN_KOU_CAMPUS, DEFAULT_A8_TO_CAMPUS_MIN),
                campusToA8Promise
            ]);
            model = ShuttleLogic.calculateEtaModel({
                state: "toA8",
                currentToA8: lastCurrentToA8,
                a8ToCampus: lastA8ToCampus,
                campusToA8: lastCampusToA8
            });
        } else {
            [lastCurrentToCampus, lastCampusToA8] = await Promise.all([
                requestGoogleMinutes({ lat, lng }, LIN_KOU_CAMPUS),
                campusToA8Promise
            ]);
            model = ShuttleLogic.calculateEtaModel({
                state: "toAdvantech",
                currentToCampus: lastCurrentToCampus,
                campusToA8: lastCampusToA8
            });
        }

        if (!model || lastEtaStatus === "nearCampus" ||
            !driverRuntime.acceptAsyncToken(asyncToken)) return;
        lastEtaStatus = null;
        lastEtaToCampus = model.etaToCampus;
        lastTotalCommute = model.totalCommute;
        lastTrafficTime = lastCampusToA8;
        lastGoogleUpdate = Date.now();
        await updateFirebaseETA(runningType, true);
        const cycleRecord = ShuttleV2Core.buildEtaCycleRecord({
            type: runningType,
            cycleId,
            sessionId: mySessionId,
            deviceId: myDeviceId,
            queriedAt: lastGoogleUpdate,
            status: "success",
            etaToCampus: lastEtaToCampus,
            totalCommute: lastTotalCommute
        });
        await set(
            ref(db, ShuttleV2Core.buildEtaCyclePath(cycleId, runningType)),
            cycleRecord
        );
        await update(ref(db, "shuttle/" + runningType), {
            googleCycleId: cycleId,
            googleCycleStatus: "success"
        });

        addHistory({
            event: "google_eta",
            type: runningType,
            direction,
            lat,
            lng,
            etaToCampus: lastEtaToCampus,
            totalCommute: lastTotalCommute,
            currentToA8: lastCurrentToA8,
            a8ToCampus: lastA8ToCampus,
            campusToA8: lastCampusToA8
        });
    } catch (err) {
        console.error("Google ETA 更新失敗", err);
        if (driverRuntime.acceptAsyncToken(asyncToken)) {
            const failedAt = Date.now();
            const cycleRecord = ShuttleV2Core.buildEtaCycleRecord({
                type: runningType,
                cycleId,
                sessionId: mySessionId,
                deviceId: myDeviceId,
                queriedAt: failedAt,
                status: "failed",
                etaToCampus: null,
                totalCommute: null
            });
            await set(
                ref(db, ShuttleV2Core.buildEtaCyclePath(cycleId, runningType)),
                cycleRecord
            );
            await update(ref(db, "shuttle/" + runningType), {
                googleAttemptedAt: lastGoogleAttempt,
                googleCycleId: cycleId,
                googleCycleStatus: "failed"
            });
        }
    } finally {
        etaRequestInFlight = false;
    }
}

async function updateFirebaseETA(runningType, fromGoogle = false) {
    if (!driverRuntime.canWriteLive(runningType)) return;
    const payload = {
        stopStatus: currentStopStatus,
        etaStatus: lastEtaStatus,
        etaToCampus: lastEtaToCampus,
        totalCommute: lastTotalCommute,
        trafficTime: lastTrafficTime,
        currentToA8: lastCurrentToA8,
        a8ToCampus: lastA8ToCampus,
        campusToA8: lastCampusToA8,
        timestamp: Date.now()
    };

    if (fromGoogle) {
        payload.googleUpdatedAt = lastGoogleUpdate;
    }

    await update(ref(db, "shuttle/" + runningType), payload);
    updateDriverETA();
}

function updateDriverETA() {
    if (currentStopStatus === "atCampus") {
        document.getElementById("eta").innerText = "預估抵達園區：園區待發";
    } else if (lastEtaStatus === "nearCampus") {
        document.getElementById("eta").innerText = "預估抵達園區：即將抵達園區";
    } else if (lastEtaToCampus === null || lastEtaToCampus === undefined) {
        document.getElementById("eta").innerText = "預估抵達園區：計算中...";
    } else if (lastEtaToCampus === 0) {
        document.getElementById("eta").innerText = "預估抵達園區：園區待發";
    } else {
        document.getElementById("eta").innerText = "預估抵達園區：" + lastEtaToCampus + " 分鐘";
    }
}

function logDirectionChange(type, lat, lng, direction) {
    if (direction !== lastLoggedDirection) {
        lastLoggedDirection = direction;
        addHistory({
            event: "direction_changed",
            type,
            direction,
            lat,
            lng
        });
    }
}

function logStop(point, type, lat, lng, direction) {
    if (lastStopPoint === point) return;

    lastStopPoint = point;

    addHistory({
        event: "arrived_" + point,
        type,
        direction,
        lat,
        lng
    });
}

function checkAndTriggerKillSwitch(runningType) {
    const hour = new Date().getHours();

    if (hour >= AUTO_STOP_HOUR) {
        autoStop(runningType);
        return true;
    }

    return false;
}

async function processLatestPosition(type) {
    if (!latestGpsPosition || processingPosition || selectedType !== type) return;
    if (!ShuttleV2Core.isPeakTrackingTime(new Date()) ||
        !driverRuntime.canWriteLive(type)) return;
    processingPosition = true;

    try {
        const { latitude, longitude, accuracy } = latestGpsPosition.coords;
        const sourceTimestamp = Number(latestGpsPosition.timestamp) || Date.now();
        const previousStopStatus = currentStopStatus;
        getTerminalStopStatus(latitude, longitude);
        if (!ShuttleLogic.isNewGpsFix(lastProcessedGpsTimestamp, { timestamp: sourceTimestamp })) {
            if (currentStopStatus !== previousStopStatus) {
                directionTracker.force(lastDirection);
                await update(ref(db, "shuttle/" + type), {
                    direction: lastDirection,
                    stopStatus: currentStopStatus,
                    heartbeatAt: Date.now()
                });
            }
            return;
        }
        lastProcessedGpsTimestamp = sourceTimestamp;
        const direction = getDirection(latitude, longitude, accuracy);
        const routeState = currentStopStatus || direction;
        const routeModel = currentStopStatus
            ? ShuttleV2Core.calculateVehicleEta({
                state: currentStopStatus,
                a8ToCampus: lastA8ToCampus || DEFAULT_A8_TO_CAMPUS_MIN,
                campusToA8: lastCampusToA8 || DEFAULT_A8_TO_CAMPUS_MIN
            })
            : ShuttleV2Core.estimateRouteEta({
                state: routeState,
                lat: latitude,
                lng: longitude,
                routes: [
                    { direction: "toA8", points: ROUTE_POINTS.red },
                    { direction: "toAdvantech", points: ROUTE_POINTS.green1 },
                    { direction: "toAdvantech", points: ROUTE_POINTS.green2 }
                ],
                campusToA8Minutes: lastCampusToA8 || DEFAULT_A8_TO_CAMPUS_MIN,
                a8ToCampusMinutes: lastA8ToCampus || DEFAULT_A8_TO_CAMPUS_MIN,
                maxRouteDistanceMeters: ROUTE_MATCH_MAX_DISTANCE
            });

        lastPosition = { lat: latitude, lng: longitude, direction, gpsUpdatedAt: sourceTimestamp };
        driverRuntime.queueArchivePoint({
            timestamp: sourceTimestamp,
            lat: latitude,
            lng: longitude,
            accuracy: Math.round(accuracy || 0),
            direction,
            stopStatus: currentStopStatus,
            type,
            cycleId: ShuttleV2Core.buildEtaCycleId(sourceTimestamp)
        });

        await update(ref(db, "shuttle/" + type), {
            lat: latitude,
            lng: longitude,
            accuracy: Math.round(accuracy || 0),
            direction,
            stopStatus: currentStopStatus,
            etaStatus: lastEtaStatus,
            etaToCampus: lastEtaToCampus,
            totalCommute: lastTotalCommute,
            trafficTime: lastTrafficTime,
            routeEtaToCampus: routeModel ? routeModel.arrivalMinutes : null,
            routeTotalCommute: routeModel ? routeModel.commuteMinutes : null,
            routeUpdatedAt: routeModel ? sourceTimestamp : null,
            gpsUpdatedAt: sourceTimestamp,
            heartbeatAt: Date.now(),
            timestamp: sourceTimestamp,
            status: "online",
            type,
            sessionId: mySessionId,
            deviceId: myDeviceId,
            tabId: myTabId
        });

        logDirectionChange(type, latitude, longitude, direction);
        document.getElementById("status").innerText =
            "狀態：📍 追蹤中 (" + (type === "small" ? "小巴" : "中巴") + ")";
        document.getElementById("direction").innerText =
            "方向：" + directionText(direction, latitude, longitude);
        document.getElementById("lat").innerText = "目前緯度：" + latitude.toFixed(6);
        document.getElementById("lng").innerText = "目前經度：" + longitude.toFixed(6);

    } finally {
        processingPosition = false;
    }
}

async function sendHeartbeat(type) {
    if (!selectedType || selectedType !== type) return;
    const result = await driverRuntime.heartbeat();
    if (!result.updated && result.reason === "not-owner") {
        stopLocalTracking("定位已由另一台裝置接手");
    }
}

function stopLocalTracking(message) {
    if (watchId) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }

    if (autoStopTimer) {
        clearInterval(autoStopTimer);
        autoStopTimer = null;
    }

    if (locationSampleTimer) {
        clearInterval(locationSampleTimer);
        locationSampleTimer = null;
    }
    if (heartbeatTimer) {
        clearInterval(heartbeatTimer);
        heartbeatTimer = null;
    }
    if (sharedTrafficTimer) {
        clearInterval(sharedTrafficTimer);
        sharedTrafficTimer = null;
    }
    if (archiveTimer) {
        clearInterval(archiveTimer);
        archiveTimer = null;
    }
    document.getElementById("status").innerText =
        "狀態：" + (message || "🟢 已切換為依班表行駛");
    document.getElementById("direction").innerText = "方向：非動態追蹤時段";
    document.getElementById("eta").innerText = "預估抵達園區：--";
}

async function autoStop(runningType) {
    if (!runningType || runningType !== selectedType) return;
    try {
        await flushArchiveWithRetry();
        await uploadHistory();
    } finally {
        stopLocalTracking("🟢 19:00 已自動封存並停止動態追蹤");
        await driverRuntime.releaseOwnedVehicle("19:00-auto-archive");
        if (ownerUnsubscribe) {
            ownerUnsubscribe();
            ownerUnsubscribe = null;
        }
        document.getElementById("btn-small").className = "";
        document.getElementById("btn-medium").className = "";
        selectedType = null;
    }
}

function resetTrackingState() {
    lastLat = null;
    lastLng = null;
    lastDirection = "unknown";
    lastEtaToCampus = null;
    lastTotalCommute = null;
    lastTrafficTime = null;
    lastEtaStatus = null;
    lastGoogleUpdate = 0;
    lastGoogleAttempt = 0;
    etaRequestInFlight = false;
    lastProcessedGpsTimestamp = null;
    lastA8ToCampus = null;
    lastCampusToA8 = null;
    lastCurrentToA8 = null;
    lastCurrentToCampus = null;
    lastPosition = null;
    lastLoggedDirection = null;
    lastStopPoint = null;
    directionTracker = new ShuttleLogic.DirectionTracker({
        routes: [
            { name: "red", direction: "toA8", points: ROUTE_POINTS.red },
            { name: "green1", direction: "toAdvantech", points: ROUTE_POINTS.green1 },
            { name: "green2", direction: "toAdvantech", points: ROUTE_POINTS.green2 }
        ],
        turnZones: [
            // 文明路／文德路及綠線2匯入共同路段：區內凍結既有方向。
            { lat: 25.06072, lng: 121.37877, radiusMeters: 65 },
            { lat: 25.05651, lng: 121.37872, radiusMeters: 65 },
            // 紅線復興二路接文昌五街。
            { lat: 25.05482, lng: 121.37621, radiusMeters: 70 }
        ],
        minMoveMeters: DIRECTION_MIN_MOVE,
        maxAccuracy: DIRECTION_MAX_ACCURACY,
        maxRouteDistance: ROUTE_MATCH_MAX_DISTANCE
    });
    latestGpsPosition = null;
    terminalCandidate = null;
    terminalStillSince = 0;
    terminalAnchor = null;
    currentStopStatus = null;
    processingPosition = false;
    commuteHistory = [];
}

function startPeakLocationTracking(type) {
    if (watchId || !selectedType || selectedType !== type ||
        !driverRuntime.canWriteLive(type) ||
        !ShuttleV2Core.isPeakTrackingTime(new Date())) return;
    document.getElementById("status").innerText =
        "狀態：📍 啟動定位中 (" + (type === "small" ? "小巴" : "中巴") + ")";
    watchId = navigator.geolocation.watchPosition((pos) => {
        if (!latestGpsPosition || ShuttleLogic.isNewGpsFix(latestGpsPosition.timestamp, pos)) {
            latestGpsPosition = pos;
        }
    }, (err) => {
        document.getElementById("status").innerText =
            "狀態：❌ GPS 失敗 - " + err.message;
    }, {
        enableHighAccuracy: true,
        maximumAge: 3000,
        timeout: 10000
    });
    locationSampleTimer = setInterval(() => processLatestPosition(type), GPS_SAMPLE_INTERVAL);
    refreshSharedTrafficSegments();
    sharedTrafficTimer = setInterval(refreshSharedTrafficSegments, SHARED_TRAFFIC_INTERVAL);
    archiveTimer = setInterval(flushArchiveWithRetry, ARCHIVE_INTERVAL);
    scheduleNextEtaCycle(type);
}

function scheduleNextEtaCycle(type) {
    if (autoStopTimer) clearTimeout(autoStopTimer);
    const now = Date.now();
    const delay = CURRENT_ETA_INTERVAL - (now % CURRENT_ETA_INTERVAL) + 250;
    autoStopTimer = setTimeout(async () => {
        autoStopTimer = null;
        if (selectedType === type && driverRuntime.canWriteLive(type) &&
            ShuttleV2Core.isPeakTrackingTime(new Date()) && lastPosition) {
            await calculateAndPushETA(
                type,
                lastPosition.lat,
                lastPosition.lng,
                lastPosition.direction
            );
        }
        if (selectedType === type && ShuttleV2Core.isPeakTrackingTime(new Date())) {
            scheduleNextEtaCycle(type);
        }
    }, delay);
}

async function syncTrackingWindow() {
    if (!selectedType) return;
    if (ShuttleV2Core.isPeakTrackingTime(new Date())) {
        startPeakLocationTracking(selectedType);
    } else if (new Date().getHours() >= AUTO_STOP_HOUR) {
        await autoStop(selectedType);
    }
}

window.selectBus = async (type) => {
    if (selectingBus) return;
    selectingBus = true;
    try {
        if (selectedType === type && driverRuntime.canWriteLive(type)) return;
        if (selectedType && selectedType !== type) {
            await flushArchiveWithRetry();
            stopLocalTracking("🔄 正在切換車型");
            await driverRuntime.releaseOwnedVehicle("switch-vehicle");
            if (ownerUnsubscribe) {
                ownerUnsubscribe();
                ownerUnsubscribe = null;
            }
            selectedType = null;
        }

        let claim = await driverRuntime.claimVehicle(type, { takeoverConfirmed: false });
        if (!claim.ok && claim.reason === "occupied") {
            const seconds = Math.max(0, Math.round(claim.heartbeatAgeMs / 1000));
            const label = type === "small" ? "小巴" : "中巴";
            const confirmed = window.confirm(
                label + "目前由另一台裝置定位中，最後更新 " + seconds +
                " 秒前。確定要接手" + label + "的定位嗎？"
            );
            if (!confirmed) return;
            claim = await driverRuntime.claimVehicle(type, { takeoverConfirmed: true });
        }
        if (!claim.ok) {
            document.getElementById("status").innerText = "狀態：⚠️ 車輛目前由其他司機使用";
            return;
        }

        selectedType = type;
        resetTrackingState();
        const currentSnapshot = await get(ref(db, "shuttle/" + type));
        const currentValue = currentSnapshot.val() || {};
        lastGoogleAttempt = Number(currentValue.googleAttemptedAt) || 0;
        driverRuntime.handleVehicleSnapshot(type, currentValue);

        if (ownerUnsubscribe) ownerUnsubscribe();
        ownerUnsubscribe = onValue(ref(db, "shuttle/" + type), snapshot => {
            const value = snapshot.val() || {};
            driverRuntime.handleVehicleSnapshot(type, value);
            if (selectedType === type && !driverRuntime.canWriteLive(type)) {
                stopLocalTracking("⚠️ 定位已由另一台裝置接手");
                selectedType = null;
                document.getElementById("btn-small").className = "";
                document.getElementById("btn-medium").className = "";
            }
        });

        document.getElementById("btn-small").className =
            type === "small" ? "active-small" : "";
        document.getElementById("btn-medium").className =
            type === "medium" ? "active-medium" : "";
        document.getElementById("status").innerText =
            ShuttleV2Core.isPeakTrackingTime(new Date())
                ? "狀態：📍 啟動定位中..."
                : "狀態：🟢 已選車，17:00 開始動態追蹤";

        heartbeatTimer = setInterval(() => sendHeartbeat(type), HEARTBEAT_INTERVAL);
        await sendHeartbeat(type);
        await syncTrackingWindow();
    } finally {
        selectingBus = false;
    }
};

window.stopTracking = async () => {
    // 保留空函式以相容舊快取頁面；正式介面已移除手動停止按鈕。
};

window.addEventListener("beforeunload", () => {
    // 不在卸載事件中非同步改寫 Firebase；未上傳點已同步保存於 localStorage。
});

window.addEventListener("pagehide", () => {
    // 由 60 秒 lease 判定斷線；避免舊分頁把接手者設成離線。
});

trackingWindowTimer = setInterval(syncTrackingWindow, 30000);

</script>
