<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研華接駁車助手 - 林口園區</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; text-align: center; }
        .decision-box { padding: 15px; border-radius: 10px; font-weight: bold; font-size: 1.2rem; margin: 15px 0; transition: all 0.3s ease; }
        .go-walk { background: #e8f5e9; color: #2e7d32; border: 2px solid #2e7d32; }
        .wait-bus { background: #e3f2fd; color: #1565c0; border: 2px solid #1565c0; }
        .warning { background: #fff3e0; color: #666; border: 2px solid #ef6c00; }
        .stats { display: flex; justify-content: space-around; margin-top: 15px; }
        .stat-item { flex: 1; }
        .time { font-size: 1.5rem; font-weight: bold; display: block; }
        .label { font-size: 0.8rem; color: #666; }
        .qr-section { font-size: 0.8rem; color: #999; margin-top: 30px; text-align: center; }
    </style>
</head>
<body>

<h2 style="text-align: center;">通勤決策助手 (Real-time)</h2>

<div class="card">
    <div id="decision-status" class="decision-box">連線中...</div>
    <p id="reasoning" style="font-size: 0.9rem;">正在同步巴士即時位置...</p>

    <div class="stats">
        <div class="stat-item">
            <span class="label">等車+車程</span>
            <span id="bus-time" class="time">-- min</span>
        </div>
        <div class="stat-item" style="border-left: 1px solid #eee;">
            <span class="label">步行前往</span>
            <span class="time">20 min</span>
        </div>
    </div>
</div>

<!-- 1. Google Maps SDK -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBYOfPOfRdXpRYxiKTGRMI4a5qTi6e1PFE&libraries=geometry"></script>

<!-- 2. Firebase 邏輯 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDxDD9jZA25Hk19HF0UUo0f3ZiEWv1azuk",
        authDomain: "advantech-shuttle-tracker.firebaseapp.com",
        databaseURL: "https://advantech-shuttle-tracker-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "advantech-shuttle-tracker",
        storageBucket: "advantech-shuttle-tracker.firebasestorage.app",
        messagingSenderId: "749819334514",
        appId: "1:749819334514:web:582850faa8216c5b7d57eb",
        measurementId: "G-1V8B0TVM17"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 儲存兩台巴士的數據
    let busData = { small: null, medium: null };

    // UI 渲染
    function renderDecision(actualDriveTime, actualWalkTime) {
        const threshold = 2; 
        const display = document.getElementById('decision-status');
        const busLabel = document.getElementById('bus-time');
        const reasonBox = document.getElementById('reasoning');

        busLabel.innerText = Math.round(actualDriveTime) + " min";

        if (actualDriveTime > (actualWalkTime + threshold)) {
            display.innerText = "建議走路！";
            display.className = "decision-box go-walk";
            reasonBox.innerText = `目前路況較塞，走路快 ${Math.round(actualDriveTime - actualWalkTime)} 分鐘。`;
        } else {
            display.innerText = "建議等車";
            display.className = "decision-box wait-bus";
            reasonBox.innerText = "路況良好，車輛預計準時抵達。";
        }
    }

    // Google Maps 計算
    function calculateCommuteDecision(busLat, busLng) {
        const origin = { lat: busLat, lng: busLng };
        const destination = "桃園市龜山區文德路27號"; 

        const service = new google.maps.DistanceMatrixService();
        service.getDistanceMatrix({
            origins: [origin],
            destinations: [destination],
            travelMode: 'DRIVING',
            drivingOptions: {
                departureTime: new Date(Date.now()),
                trafficModel: 'bestguess'
            },
        }, (response, status) => {
            if (status === 'OK') {
                const element = response.rows[0].elements[0];
                const driveTimeSec = element.duration_in_traffic ? element.duration_in_traffic.value : element.duration.value;
                renderDecision(driveTimeSec / 60, 20); // 步行固定 20 分鐘
            }
        });
    }

    // 決策邏輯：選擇最快到站的車
    function updateBestOption() {
        const now = Date.now();
        // 篩選 5 分鐘內有更新的車輛
        const activeBuses = Object.values(busData).filter(b => b && (now - b.timestamp) < 300000);

        if (activeBuses.length > 0) {
            // 這裡簡單取第一台，進階可寫迴圈比對哪台最近
            const bestBus = activeBuses[0]; 
            calculateCommuteDecision(bestBus.lat, bestBus.lng);
        } else {
            document.getElementById('decision-status').innerText = "暫無車輛資訊";
            document.getElementById('decision-status').className = "decision-box warning";
            document.getElementById('reasoning').innerText = "目前沒有即時巴士訊號，請參考班表。";
        }
    }

    // 監聽小巴與中巴
    onValue(ref(db, 'shuttle/small'), (snap) => { busData.small = snap.val(); updateBestOption(); });
    onValue(ref(db, 'shuttle/medium'), (snap) => { busData.medium = snap.val(); updateBestOption(); });

</script>

<div class="qr-section">
    <p>Advantech ESG - 節能減碳從走路開始</p>
</div>

</body>
</html>
