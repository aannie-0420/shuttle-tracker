    background:#f4f7f6;

    text-align:center;
}

}

}
.bus-item{

}
.bus-item:last-child{
    border-bottom:none;
}
.bus-name{
    font-weight:bold;
}
.bus-status{
    font-size:0.9rem;

.status-online{

}

}
.weather-val {

}

.mrt-grid {

    gap: 15px;
}
@media (max-width: 600px) {
    .mrt-grid {
        grid-template-columns: 1fr;

    }

}

<script type="module">

        { type: "普通車", time: "20:05" }
    ]

function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

function isVehicleOutofBounds(lat, lng) {
    const dist = getDistance(lat, lng, LIN_KOU_CAMPUS.lat, LIN_KOU_CAMPUS.lng);
    return dist > 5000;
}

function calculateETA(bus, callback) {
    if (!bus || isVehicleOutofBounds(bus.lat, bus.lng)) {
        callback(null);
        return;
    }

    const service = new google.maps.DistanceMatrixService();
    let destination = null;

    if (bus.direction === "toA8") {
        destination = A8_STATION; 
    } else if (bus.direction === "toAdvantech") {
        destination = LIN_KOU_CAMPUS; 
    } else {
        callback(null);
        return;
    }

    service.getDistanceMatrix({
        origins: [{ lat: bus.lat, lng: bus.lng }],
        destinations: [destination],
        travelMode: google.maps.TravelMode.DRIVING,
    }, (response, status) => {
        if (status === "OK" && response.rows[0].elements[0].status === "OK") {
            const durationSec = response.rows[0].elements[0].duration.value;
            const minutes = Math.ceil(durationSec / 60);
            callback({
                mins: minutes,
                dir: bus.direction,
                lat: bus.lat,
                lng: bus.lng
            });
        } else {
            callback(null);
        }
    });
}

// 🟢 調整為 90 秒判定離線
function updateBusUI(type, data, etaObj) {
    const statusEl = document.getElementById(`${type}-status`);
    const directionEl = document.getElementById(`${type}-direction`);
    const etaEl = document.getElementById(`${type}-eta`);

    const now = Date.now();
    const isOnline = data && (now - data.timestamp) < 90000; 

    if (!isOnline) {
        statusEl.innerHTML = "⚪ 離線";
        statusEl.className = "bus-status status-offline";
        directionEl.innerHTML = "--";
        etaEl.innerHTML = "--";
        return;
    }

    statusEl.innerHTML = "🟢 在線";
    statusEl.className = "bus-status status-online";

    if (data.direction === "toA8") directionEl.innerHTML = "➡️ 往A8站";
    else if (data.direction === "toAdvantech") directionEl.innerHTML = "⬅️ 往園區";
    else directionEl.innerHTML = "❓ 判斷中";

    if (etaObj && etaObj !== "--") {
        etaEl.innerHTML = etaObj.mins + " 分鐘";
    } else {
        etaEl.innerHTML = "--";
    }
}

function renderDecision(busMins, walkTime) {
    const container = document.getElementById("decision-container");
    if (busMins <= walkTime) {
        container.innerHTML = `
            <div class="decision-box wait-bus">
                🚌 建議搭乘接駁車（預估車輛 ${busMins} 分鐘後抵達，快於步行 ${walkTime} 分鐘）
            </div>`;
    } else {
        container.innerHTML = `
            <div class="decision-box go-walk">
                🚶 建議直接步行（預估接駁車需等候 ${busMins} 分鐘，直接走路 ${walkTime} 分鐘較快）
            </div>`;
    }
}

function updateUIAndCalculations() {
    const now = Date.now();
    let validBuses = [];

    // 🟢 調整為 90 秒過濾決策
    if (busData.small && (now - busData.small.timestamp) < 90000 && !isVehicleOutofBounds(busData.small.lat, busData.small.lng)) {
        if (busETAs.small !== null) validBuses.push(busETAs.small);
    }
    if (busData.medium && (now - busData.medium.timestamp) < 90000 && !isVehicleOutofBounds(busData.medium.lat, busData.medium.lng)) {
        if (busETAs.medium !== null) validBuses.push(busETAs.medium);
    }

    let baseWalkTime = 20;
    const currentHour = new Date().getHours();
    if (currentHour >= 17) baseWalkTime = 24; 
    if (currentPop >= 70) baseWalkTime += 3;

    if (validBuses.length === 0) {
        document.getElementById("decision-container").innerHTML = `
            <div class="decision-box go-walk" style="background:#fff3cd; color:#856404; border-color:#ffeeba;">
                🚶 目前無接駁車在線。下班請安全步行至 A8 機捷站（約 ${baseWalkTime} 分鐘）
            </div>`;
        return;
    }

    let bestBus = validBuses[0];
    let finalCostMins = bestBus.mins;

    if (bestBus.dir === "toAdvantech") {
        finalCostMins = bestBus.mins + 8; 
    }

    renderDecision(finalCostMins, baseWalkTime);
}

function fetchWeather() {
    const url = "https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-D0047-009?Authorization=CWA-61877FA1-FAAF-49FA-BB73-A880EBEDFF7E&locationName=%E9%BE%9龜山區&elementName=PoP6h,Wx";
    fetch(url)
        .then(res => res.json())
        .then(json => {
            const loc = json.records.locations[0].location[0];
            const popVal = loc.weatherElement.find(e => e.elementName === "PoP6h").time[0].elementValue[0].value;
            const wxVal = loc.weatherElement.find(e => e.elementName === "Wx").time[0].elementValue[0].value;
            
            currentPop = parseInt(popVal) || 0;
            document.getElementById("ui-pop").innerHTML = currentPop + " %";
            document.getElementById("ui-wx").innerHTML = wxVal;
            updateUIAndCalculations();
        }).catch(() => {});
}

function updateMRTUI() {
    const now = new Date();
    const currentMinutes = now.getHours() * 60 + now.getMinutes();

    const renderList = (list, containerId) => {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        
        const activeTrains = list.filter(t => {
            const [h, m] = t.time.split(":").map(Number);
            return (h * 60 + m) >= currentMinutes;
        }).slice(0, 4);

        if (activeTrains.length === 0) {
            container.innerHTML = `<div style="padding:10px; color:#a0aec0; text-align:center;">今日班次已發車完畢</div>`;
            return;
        }

        activeTrains.forEach(train => {
            const [h, m] = train.time.split(":").map(Number);
            const diff = (h * 60 + m) - currentMinutes;
            
            const itemDiv = document.createElement("div");
            itemDiv.className = "mrt-item";
            
            const typeClass = train.type === "直達車" ? "mrt-type-express" : "mrt-type-commuter";
            const typeLabel = train.type === "直達車" ? "直達" : "普通";
            
            let countdownText = `${diff}分鐘後`;
            if (diff === 0) countdownText = "即將進站";
                
            itemDiv.innerHTML = `
                <span class="mrt-col-type ${typeClass}">${typeLabel}</span>
                <span class="mrt-col-time">${train.time}</span>
                <span class="mrt-col-countdown mrt-countdown">${countdownText}</span>
            `;
            container.appendChild(itemDiv);
        });
    };

    renderList(MRT_TIMETABLE.toTPE, "mrt-to-tpe-list");
    renderList(MRT_TIMETABLE.toAP, "mrt-to-ap-list");
}

// 🔒 Firebase 監聽：同機切換秒踢安全鎖
////////////////////////////////////////////////////////////
onValue(ref(db, "shuttle/small"), (snap) => {
    const data = snap.val();
    busData.small = data;

    // 💡 安全鎖：同台手機切換時，秒踢舊車
    if (busData.small && busData.medium && 
        busData.small.sessionId === busData.medium.sessionId && 
        busData.medium.timestamp > busData.small.timestamp) {
        busData.small = null; 
    }

    calculateETA(busData.small, (eta) => {
        busETAs.small = eta;
        updateBusUI("small", busData.small, eta || "--");
        updateUIAndCalculations(); 
    });
});

onValue(ref(db, "shuttle/medium"), (snap) => {
    const data = snap.val();
    busData.medium = data;

    // 💡 安全鎖：同台手機切換時，秒踢舊車
    if (busData.small && busData.medium && 
        busData.small.sessionId === busData.medium.sessionId && 
        busData.small.timestamp > busData.medium.timestamp) {
        busData.medium = null; 
    }

    calculateETA(busData.medium, (eta) => {
        busETAs.medium = eta;
        updateBusUI("medium", busData.medium, eta || "--");
        updateUIAndCalculations(); 
    });
});

fetchWeather();
updateMRTUI();
setInterval(updateUIAndCalculations, 15000); 
setInterval(updateMRTUI, 30000);             
setInterval(fetchWeather, 600000);
