<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧接駁車 GPS 系統</title>

<style>
body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:#f0f0f0;
    padding:30px;
    text-align:center;
}
.card{
    background:white;
    max-width:650px;
    margin:auto;
    padding:30px;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}
.btn-group {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 20px 0;
}
button{
    flex: 1;
    max-width: 180px;
    padding: 15px 20px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    font-weight: bold;
    transition: all 0.2s ease;
}
.small{
    background:#BBDEFB;
    color:#1565C0;
    border: 2px solid transparent;
}
.medium{
    background:#C8E6C9;
    color:#2E7D32;
    border: 2px solid transparent;
}
/* 被選中時的發光效果 */
button.active-small {
    background: #1565C0;
    color: white;
    box-shadow: 0 0 12px rgba(21, 101, 192, 0.5);
}
button.active-medium {
    background: #2E7D32;
    color: white;
    box-shadow: 0 0 12px rgba(46, 125, 50, 0.5);
}
#status{
    margin-top:25px;
    font-size:24px;
    font-weight:bold;
    color: #555;
}
#direction{
    margin-top:15px;
    font-size:22px;
    font-weight:bold;
    color: #e53935;
}
.info-box {
    margin-top: 25px;
    background: #f9f9f9;
    padding: 15px;
    border-radius: 10px;
    text-align: left;
    font-size: 15px;
    line-height: 1.6;
    border: 1px solid #e0e0e0;
}
</style>
</head>
<body>

<div class="card">
    <h2>🚐 研華接駁車司機回報端</h2>
    <p style="color:#666;">請在上車出發前，點選您今日駕駛的車型：</p>
    
    <div class="btn-group">
        <button id="btn-small" class="small">🚗 駕駛小巴</button>
        <button id="btn-medium" class="medium">🚌 駕駛中巴</button>
    </div>

    <div id="status">⚪ 尚未選擇車型</div>
    <div id="direction">方向：--</div>

    <div class="info-box">
        <strong>系統即時狀態：</strong><br>
        • 目前緯度：<span id="ui-lat">--</span><br>
        • 目前經度：<span id="ui-lng">--</span><br>
        • 定位精準度：<span id="ui-acc">--</span>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// Firebase 配置
const firebaseConfig = {
    apiKey: "AIzaSyDxDD9jZA25Hk19HF0UUo0f3ZiEWv1azuk",
    authDomain: "advantech-shuttle-tracker.firebaseapp.com",
    databaseURL: "https://advantech-shuttle-tracker-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "advantech-shuttle-tracker",
    storageBucket: "advantech-shuttle-tracker.firebasestorage.app",
    messagingSenderId: "749819334514",
    appId: "1:749819334514:web:582850faa8216c5b7d57eb"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 統一與 index.html 完全一致的真實端點座標
const ADVANTECH = { lat: 25.057506, lng: 121.381707 }; // 研華林口園區
const A8 = { lat: 25.0606478, lng: 121.370454 };      // A8機捷站

// 全域控制變數
let mySessionId = Math.random().toString(36).substring(2, 10);
let selectedType = null; 
let currentDirection = "unknown";
let pendingDirection = "unknown";
let stableCount = 0;

let lastGoodLat = null;
let lastGoodLng = null;
let watchId = null;

// 綁定按鈕事件（解決 onclick 找不到函數的問題）
document.getElementById("btn-small").addEventListener("click", () => selectBus("small"));
document.getElementById("btn-medium").addEventListener("click", () => selectBus("medium"));

// 選擇車種函數
function selectBus(type) {
    selectedType = type;
    
    // 切換按鈕亮燈樣式
    if(type === 'small') {
        document.getElementById("btn-small").className = "active-small";
        document.getElementById("btn-medium").className = "medium";
    } else {
        document.getElementById("btn-medium").className = "active-medium";
        document.getElementById("btn-small").className = "small";
    }

    document.getElementById("status").innerHTML = "🟡 正在請求 GPS 定位權限...";
    
    // 如果本來就在追蹤，先停止舊的
    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
    }

    // 啟動追蹤
    startTracking();
}

// 啟動 GPS 監聽
function startTracking() {
    if (!navigator.geolocation) {
        document.getElementById("status").innerHTML = "🔴 錯誤：您的瀏覽器不支援不支援 GPS 定位";
        return;
    }

    const busRef = ref(db, "shuttle/" + selectedType);

    watchId = navigator.geolocation.watchPosition(
        (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const accuracy = Math.round(pos.coords.accuracy);
            const now = Date.now();

            // 1. 基礎過濾：精度太差(大於100米)或跳點則忽略
            if (accuracy > 100) {
                return; 
            }

            // 2. 驅動全新方向判定演算法
            detectDirection(lat, lng);

            // 3. 更新歷史對照點
            lastGoodLat = lat;
            lastGoodLng = lng;

            // 4. 即時同步推送至 Firebase Realtime Database
            set(busRef, {
                lat: lat,
                lng: lng,
                direction: currentDirection,
                accuracy: accuracy,
                timestamp: now,
                sessionId: mySessionId
            });

            // 5. 更新司機端手機 UI 看板
            document.getElementById("status").innerHTML = "🟢 系統即時連線追蹤中";
            
            let dirText = "❓ 判斷中";
            if(currentDirection === "toA8") dirText = "➡️ 前往 A8 機捷站";
            if(currentDirection === "toAdvantech") dirText = "⬅️ 返回研華林口園區";
            document.getElementById("direction").innerHTML = "方向：" + dirText;

            document.getElementById("ui-lat").innerHTML = lat.toFixed(6);
            document.getElementById("ui-lng").innerHTML = lng.toFixed(6);
            document.getElementById("ui-acc").innerHTML = accuracy + " 公尺";
        },
        (error) => {
            document.getElementById("status").innerHTML = "🔴 定位失敗：" + error.message + " (請確認手機是否開啟定位)";
        },
        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 10000
        }
    );
}

// 半正矢公式計算兩點間的公尺數距離
function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000; 
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

// 方向變更穩定緩衝機制
function updateDirection(newDirection) {
    if (newDirection === pendingDirection) {
        stableCount++;
    } else {
        pendingDirection = newDirection;
        stableCount = 1;
    }
    // 連續 2 次定位訊號方向一致就切換，加快即時反應速度
    if (stableCount >= 2) {
        currentDirection = pendingDirection;
    }
}

// 💥 動態距離即時追蹤演算法（免圍欄，自動適應文明路隨機返回）
function detectDirection(lat, lng) {
    const distA8 = getDistance(lat, lng, A8.lat, A8.lng);
    const distAdvantech = getDistance(lat, lng, ADVANTECH.lat, ADVANTECH.lng);

    // 1. 強制極端點切換
    if (distAdvantech < 80) {
        updateDirection("toA8"); // 在公司門口，肯定是去程
        return;
    }
    if (distA8 < 70) {
        updateDirection("toAdvantech"); // 抵達A8正門口，接下來肯定是回程
        return;
    }

    // 2. 剛開啟系統沒有前一點紀錄時，依當前靠近哪一端進行神經元預判
    if (lastGoodLat === null) {
        if (distAdvantech < distA8) {
            updateDirection("toA8");
        } else {
            updateDirection("toAdvantech");
        }
        return;
    }

    // 3. 核心運算：對比「上一點」與「當前點」到 A8 站的物理距離差
    const lastDistToA8 = getDistance(lastGoodLat, lastGoodLng, A8.lat, A8.lng);
    const nowDistToA8 = distA8;
    const diff = lastDistToA8 - nowDistToA8;

    // 忽略小於 12 公尺內的原地飄移誤差
    if (Math.abs(diff) < 12) {
        return;
    }

    if (diff > 0) {
        updateDirection("toA8");        // 離A8越來越近 -> 前往A8
    } else {
        updateDirection("toAdvantech"); // 離A8越來越遠 -> 回研華 (司機隨機放完人一迴轉立刻能偵測)
    }
}
</script>

</body>
</html>
