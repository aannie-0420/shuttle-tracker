<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>司機端 - 智慧追蹤版</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 20px;
    background: #f8f9fa;
}
.card {
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    max-width: 650px;
    margin: auto;
}
.btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 25px;
}
button {
    padding: 25px;
    border-radius: 15px;
    border: none;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
}
.active-small {
    background: #1565C0 !important;
    color: white !important;
}
.active-medium {
    background: #2E7D32 !important;
    color: white !important;
}
.stop-btn {
    width: 100%;
    margin-top: 20px;
    background: #c62828;
    color: white;
}
#info-panel {
    text-align: left;
    background: #e3f2fd;
    padding: 20px;
    border-radius: 15px;
    font-size: 18px;
    line-height: 2;
    font-weight: bold;
}
.warn {
    color: #d32f2f;
}
.ok {
    color: #2e7d32;
}
.small-text {
    font-size: 14px;
    color: #555;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="card">
    <h2>🚐 研華接駁車司機端</h2>

    <div class="btn-group">
        <button id="btn-small" onclick="selectBus('small')">🚗 小巴</button>
        <button id="btn-medium" onclick="selectBus('medium')">🚌 中巴</button>
    </div>

    <div id="info-panel">
        <div id="status">狀態：⚪ 請選擇車型</div>
        <div id="direction">方向：--</div>
        <div id="eta" class="warn">預估抵達園區：--</div>
        <div id="total">等車 + 車程：--</div>
        <div id="coords">座標：--</div>
        <div id="lat">目前緯度：--</div>
        <div id="lng">目前經度：--</div>
        <div id="accuracy">定位精準度：--</div>
        <div id="google-status">Google ETA：尚未啟動</div>
        <div id="log-count">暫存 Log：0 筆</div>
        <div id="session">Session：--</div>
    </div>

    <button class="stop-btn" onclick="stopTracking()">停止追蹤 / 下班封存</button>

    <p class="small-text">
        GPS 約 3 秒更新位置與方向；Google ETA 約 90 秒更新一次。<br>
        19:00 後會自動封存歷史紀錄，並將車輛狀態切換為依班表行駛。
    </p>
</div>

<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=geometry"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, update, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDxDD9jZA25Hk19HF0UUo0f3ZiEWv1azuk",
    databaseURL: "https://advantech-shuttle-tracker-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "advantech-shuttle-tracker",
    appId: "1:749819334514:web:582850faa8216c5b7d57eb"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const LIN_KOU_CAMPUS = {
    lat: 25.057506,
    lng: 121.381707
};

const A8_STATION_GPS = {
    lat: 25.0606478,
    lng: 121.370454
};

const GOOGLE_ETA_INTERVAL = 90000;
const GPS_MIN_MOVE_FOR_DIRECTION = 15;
const STOP_RADIUS = 60;
const DEFAULT_ONE_WAY_MIN = 15;

let selectedType = null;
let watchId = null;
let etaInterval = null;

let myDeviceId = getOrCreateDeviceId();
let mySessionId = createSessionId();

let commuteHistory = [];

let lastLat = null;
let lastLng = null;
let lastDirection = "unknown";

let lastEtaToCampus = null;
let lastTotalCommute = null;
let lastTrafficTime = null;
let lastGoogleUpdate = 0;

document.getElementById("session").innerText = "Session：" + mySessionId;

function getOrCreateDeviceId() {
    let id = localStorage.getItem("driver_device_id");
    if (!id) {
        id = "driver_" + Date.now() + "_" + Math.random().toString(36).substring(2, 8);
        localStorage.setItem("driver_device_id", id);
    }
    return id;
}

function createSessionId() {
    const now = new Date();
    const date =
        now.getFullYear() +
        String(now.getMonth() + 1).padStart(2, "0") +
        String(now.getDate()).padStart(2, "0") +
        "_" +
        String(now.getHours()).padStart(2, "0") +
        String(now.getMinutes()).padStart(2, "0");

    return myDeviceId + "_" + date;
}

function distanceMeters(lat1, lng1, lat2, lng2) {
    if (window.google && google.maps && google.maps.geometry) {
        const p1 = new google.maps.LatLng(lat1, lng1);
        const p2 = new google.maps.LatLng(lat2, lng2);
        return google.maps.geometry.spherical.computeDistanceBetween(p1, p2);
    }

    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLng / 2) ** 2;

    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function getDirection(lat, lng, accuracy) {
    const distanceToCampus = distanceMeters(lat, lng, LIN_KOU_CAMPUS.lat, LIN_KOU_CAMPUS.lng);
    const distanceToA8 = distanceMeters(lat, lng, A8_STATION_GPS.lat, A8_STATION_GPS.lng);

    if (distanceToCampus <= STOP_RADIUS) {
        lastDirection = "toA8";
        return "toA8";
    }

    if (distanceToA8 <= STOP_RADIUS) {
        lastDirection = "toAdvantech";
        return "toAdvantech";
    }

    if (accuracy && accuracy > 100) {
        return lastDirection;
    }

    if (lastLat === null || lastLng === null) {
        lastLat = lat;
        lastLng = lng;
        return lastDirection;
    }

    const moved = distanceMeters(lastLat, lastLng, lat, lng);

    if (moved < GPS_MIN_MOVE_FOR_DIRECTION) {
        return lastDirection;
    }

    const oldDistanceToCampus = distanceMeters(lastLat, lastLng, LIN_KOU_CAMPUS.lat, LIN_KOU_CAMPUS.lng);
    const newDistanceToCampus = distanceMeters(lat, lng, LIN_KOU_CAMPUS.lat, LIN_KOU_CAMPUS.lng);

    lastLat = lat;
    lastLng = lng;

    if (newDistanceToCampus > oldDistanceToCampus) {
        lastDirection = "toA8";
    } else {
        lastDirection = "toAdvantech";
    }

    return lastDirection;
}

function directionText(direction, lat, lng) {
    const distanceToCampus = distanceMeters(lat, lng, LIN_KOU_CAMPUS.lat, LIN_KOU_CAMPUS.lng);
    const distanceToA8 = distanceMeters(lat, lng, A8_STATION_GPS.lat, A8_STATION_GPS.lng);

    if (direction === "toA8") {
        if (distanceToCampus <= STOP_RADIUS) return "📍 停靠在研華園區";
        return "➡️ 前往 A8 機捷站";
    }

    if (direction === "toAdvantech") {
        if (distanceToA8 <= STOP_RADIUS) return "📍 停靠在 A8 機捷站";
        return "⬅️ 返回研華園區";
    }

    return "🚌 行駛中 / 方向判定中";
}

function addHistory(entry) {
    commuteHistory.push({
        ...entry,
        time: new Date().toISOString(),
        sessionId: mySessionId,
        deviceId: myDeviceId
    });

    document.getElementById("log-count").innerText = "暫存 Log：" + commuteHistory.length + " 筆";
}

async function uploadHistory() {
    if (commuteHistory.length === 0) return;

    const archiveRef = ref(db, "archive/" + mySessionId + "/" + Date.now());

    try {
        await set(archiveRef, commuteHistory);
        commuteHistory = [];
        document.getElementById("log-count").innerText = "暫存 Log：0 筆";
    } catch (err) {
        console.error("Log 上傳失敗", err);
    }
}

function checkAndTriggerKillSwitch(runningType) {
    const hour = new Date().getHours();

    if (hour >= 19) {
        uploadHistory();

        if (watchId) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }

        if (etaInterval) {
            clearInterval(etaInterval);
            etaInterval = null;
        }

        update(ref(db, "shuttle/" + runningType), {
            status: "scheduled",
            timestamp: Date.now(),
            sessionId: mySessionId,
            deviceId: myDeviceId
        });

        document.getElementById("status").innerText = "狀態：🟢 已切換為依班表行駛";
        document.getElementById("google-status").innerText = "Google ETA：已停止，下班封存完成";

        return true;
    }

    return false;
}

function calculateAndPushETA(runningType, lat, lng, direction) {
    if (checkAndTriggerKillSwitch(runningType)) return;

    if (!window.google || !google.maps) {
        document.getElementById("google-status").innerText = "Google ETA：Google Maps 尚未載入";
        return;
    }

    const now = Date.now();

    if (now - lastGoogleUpdate < GOOGLE_ETA_INTERVAL) {
        return;
    }

    lastGoogleUpdate = now;

    const service = new google.maps.DistanceMatrixService();

    let origins = [];
    let destinations = [];

    if (direction === "toA8") {
        origins = [
            { lat, lng },
            A8_STATION_GPS,
            LIN_KOU_CAMPUS
        ];
        destinations = [
            A8_STATION_GPS,
            LIN_KOU_CAMPUS
        ];
    } else {
        origins = [
            { lat, lng },
            LIN_KOU_CAMPUS
        ];
        destinations = [
            LIN_KOU_CAMPUS,
            A8_STATION_GPS
        ];
    }

    service.getDistanceMatrix({
        origins,
        destinations,
        travelMode: "DRIVING",
        drivingOptions: {
            departureTime: new Date(),
            trafficModel: "bestguess"
        }
    }, async (response, status) => {
        if (status !== "OK") {
            lastEtaToCampus = DEFAULT_ONE_WAY_MIN;
            lastTotalCommute = DEFAULT_ONE_WAY_MIN * 2;

            document.getElementById("google-status").innerText =
                "Google ETA：失敗，使用預設 " + DEFAULT_ONE_WAY_MIN + " 分鐘";

            return;
        }

        try {
            if (direction === "toA8") {
                const minBusToA8 = Math.round(response.rows[0].elements[0].duration.value / 60);
                const minA8ToCampus = Math.round(response.rows[1].elements[1].duration.value / 60);
                const minCampusToA8 = Math.round(response.rows[2].elements[0].duration.value / 60);

                lastEtaToCampus = minBusToA8 + minA8ToCampus;
                lastTotalCommute = lastEtaToCampus + minCampusToA8;
                lastTrafficTime = minCampusToA8;
            } else {
                const minBusToCampus = Math.round(response.rows[0].elements[0].duration.value / 60);
                const minCampusToA8 = Math.round(response.rows[1].elements[1].duration.value / 60);

                lastEtaToCampus = minBusToCampus;
                lastTotalCommute = minBusToCampus + minCampusToA8;
                lastTrafficTime = minCampusToA8;
            }

            await update(ref(db, "shuttle/" + runningType), {
                etaToCampus: lastEtaToCampus,
                totalCommute: lastTotalCommute,
                trafficTime: lastTrafficTime,
                googleUpdatedAt: Date.now()
            });

            addHistory({
                event: "google_eta",
                type: runningType,
                direction,
                lat,
                lng,
                etaToCampus: lastEtaToCampus,
                totalCommute: lastTotalCommute,
                trafficTime: lastTrafficTime
            });

            document.getElementById("eta").innerText =
                "預估抵達園區：" + lastEtaToCampus + " 分鐘";

            document.getElementById("total").innerText =
                "等車 + 車程：" + lastTotalCommute + " 分鐘";

            document.getElementById("google-status").innerText =
                "Google ETA：已更新，園區→A8 約 " + lastTrafficTime + " 分鐘";

        } catch (err) {
            console.error("Google ETA 解析失敗", err);
        }
    });
}

window.selectBus = async (type) => {
    selectedType = type;

    if (watchId) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }

    if (etaInterval) {
        clearInterval(etaInterval);
        etaInterval = null;
    }

    lastLat = null;
    lastLng = null;
    lastDirection = "unknown";
    lastEtaToCampus = null;
    lastTotalCommute = null;
    lastTrafficTime = null;
    lastGoogleUpdate = 0;
    commuteHistory = [];

    await update(ref(db, "shuttle/small"), {
        status: "offline",
        timestamp: 0
    });

    await update(ref(db, "shuttle/medium"), {
        status: "offline",
        timestamp: 0
    });

    document.getElementById("btn-small").className = type === "small" ? "active-small" : "";
    document.getElementById("btn-medium").className = type === "medium" ? "active-medium" : "";
    document.getElementById("status").innerText = "狀態：📍 啟動定位中...";

    watchId = navigator.geolocation.watchPosition(async (pos) => {
        if (checkAndTriggerKillSwitch(type)) return;

        const {
            latitude,
            longitude,
            accuracy
        } = pos.coords;

        const direction = getDirection(latitude, longitude, accuracy);
        const now = Date.now();

        await update(ref(db, "shuttle/" + type), {
            lat: latitude,
            lng: longitude,
            accuracy: Math.round(accuracy || 0),
            direction,
            etaToCampus: lastEtaToCampus,
            totalCommute: lastTotalCommute,
            trafficTime: lastTrafficTime,
            timestamp: now,
            status: "online",
            type,
            sessionId: mySessionId,
            deviceId: myDeviceId
        });

        addHistory({
            event: "gps",
            type,
            direction,
            lat: latitude,
            lng: longitude,
            accuracy: Math.round(accuracy || 0),
            etaToCampus: lastEtaToCampus,
            totalCommute: lastTotalCommute
        });

        document.getElementById("status").innerText =
            "狀態：📍 追蹤中 (" + (type === "small" ? "小巴" : "中巴") + ")";

        document.getElementById("direction").innerText =
            "方向：" + directionText(direction, latitude, longitude);

        document.getElementById("coords").innerText =
            "座標：" + latitude.toFixed(6) + ", " + longitude.toFixed(6);

        document.getElementById("lat").innerText =
            "目前緯度：" + latitude.toFixed(6);

        document.getElementById("lng").innerText =
            "目前經度：" + longitude.toFixed(6);

        document.getElementById("accuracy").innerText =
            "定位精準度：" + Math.round(accuracy || 0) + " 公尺";

        calculateAndPushETA(type, latitude, longitude, direction);

    }, (err) => {
        document.getElementById("status").innerText =
            "狀態：❌ GPS 失敗 - " + err.message;
    }, {
        enableHighAccuracy: true,
        maximumAge: 3000,
        timeout: 10000
    });

    etaInterval = setInterval(() => {
        lastGoogleUpdate = 0;
    }, GOOGLE_ETA_INTERVAL);
};

window.stopTracking = async () => {
    if (!selectedType) return;

    await uploadHistory();

    if (watchId) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }

    if (etaInterval) {
        clearInterval(etaInterval);
        etaInterval = null;
    }

    await update(ref(db, "shuttle/" + selectedType), {
        status: "offline",
        timestamp: 0,
        sessionId: mySessionId,
        deviceId: myDeviceId
    });

    document.getElementById("status").innerText = "狀態：🔴 已停止追蹤";
    document.getElementById("google-status").innerText = "Google ETA：已停止";

    selectedType = null;
};

window.addEventListener("beforeunload", () => {
    if (selectedType) {
        uploadHistory();

        update(ref(db, "shuttle/" + selectedType), {
            timestamp: 0,
            status: "offline",
            sessionId: mySessionId,
            deviceId: myDeviceId
        });
    }
});

window.addEventListener("pagehide", () => {
    if (selectedType) {
        uploadHistory();
    }
});

setInterval(() => {
    if (selectedType) {
        checkAndTriggerKillSwitch(selectedType);
    }
}, 30000);

</script>

</body>
</html>
